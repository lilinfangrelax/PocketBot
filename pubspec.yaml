name: pocket_bot
description: A modern mobile client for Agent Client Protocol (ACP) agents, built with Flutter.

publish_to: 'none'

version: 1.2.31-beta

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.10.0'

dependencies:
  flutter:
    sdk: flutter

  # Core
  cupertino_icons: ^1.0.2
  provider: ^6.0.5
  shared_preferences: ^2.2.2
  google_fonts: ^6.1.0

  # File handling
  mime: ^1.0.4
  dio: ^5.4.0
  image_picker: ^1.0.4

  # Networking
  web_socket_channel: ^2.4.0
  http: ^1.1.0
  dartssh2: ^3.3.1
  pocketbot_remote:
    path: packages/pocketbot_remote

  # Security
  flutter_secure_storage: ^9.0.0

  url_launcher: ^6.2.1
  open_filex: ^4.6.0
  permission_handler: ^11.1.0
  package_info_plus: ^5.0.1
  path_provider: ^2.1.1
  intl: ^0.20.2
  # 4.16 needs Flutter 3.44 APIs. CI builds with Flutter 3.38.
  fluent_ui: 4.15.1
  logger: ^2.0.2
  flutter_local_notifications: ^17.0.0
  flutter_markdown: ^0.7.3
  markdown: ^7.2.2

  # Database
  sqflite: ^2.3.0
  # Windows and Linux have no sqflite plugin. The FFI build stores contacts
  # and group chats on those desktops.
  sqflite_common_ffi: ^2.3.4
  sqlite3_flutter_libs: ^0.5.28
  path: ^1.8.3

  # Utilities
  uuid: ^4.2.1
  crypto: ^3.0.7
  # Windows update checks read the system proxy and root store.
  ffi: ^2.1.0

  # Tailscale - using network approach instead of package

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  test: ^1.24.0

  # Testing
  mockito: ^5.4.2
  build_runner: ^2.4.6
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
  fonts:
    - family: LXGW WenKai
      fonts:
        - asset: assets/fonts/LXGWWenKai-Regular.ttf
