name: Deploy OTA Update

on:
  push:
    branches: [main, master]
    paths:
      - 'lib/**'
      - 'pubspec.yaml'
      - 'assets/**'
  workflow_dispatch:
    inputs:
      force:
        description: '强制更新'
        required: false
        default: 'false'
      ota_server:
        description: 'OTA 服务器地址'
        required: false
        default: 'http://localhost:3000'

jobs:
  build-and-deploy:
    runs-on: windows-2022
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.0'
          
      - name: Get Version
        id: version
        run: |
          $version = (Get-Content pubspec.yaml | Select-String "^version:").Line -replace "version: ","" -replace " \+.*",""
          echo "version=$version" >> $env:GITHUB_OUTPUT
          echo "分支: ${{ github.ref_name }}"
          echo "版本: $version"
        shell: pwsh
        
      - name: Install Dependencies
        run: flutter pub get
        
      - name: Build Windows
        run: flutter build windows --release
        
      - name: Create Update Package
        run: |
          $zipName = "update-${{ steps.version.outputs.version }}.zip"
          $version = "${{ steps.version.outputs.version }}"
          
          # 复制必要文件
          mkdir build-output
          Copy-Item "build\windows\x64\release\bundle\*" -Recurse -Destination build-output\
          
          # 添加版本文件
          Set-Content -Path "build-output\version.txt" -Value $version
          
          # 压缩
          Compress-Archive -Path "build-output\*" -DestinationPath $zipName -Force
          
          echo "ZIP_NAME=$zipName" >> $env:GITHUB_OUTPUT
          echo "ZIP_SIZE=$( (Get-Item $zipName).Length / 1KB ) KB" >> $env:GITHUB_OUTPUT
        shell: pwsh
        
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ota-update-${{ steps.version.outputs.version }}
          path: ${{ env.ZIP_NAME }}
          retention-days: 5
          
      - name: Deploy to OTA Server
        if: ${{ github.event_name == 'push' || github.event.inputs.ota_server != '' }}
        env:
          OTA_SERVER: ${{ github.event.inputs.ota_server || 'http://localhost:3000' }}
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $changelog = "${{ github.event.head_commit.message || '自动更新' }}"
          $force = "${{ github.event.inputs.force || 'false' }}"
          
          echo "部署到 OTA 服务器: $env:OTA_SERVER"
          echo "版本: $version"
          echo "更新日志: $changelog"
          echo "强制更新: $force"
          
          # 上传更新包
          $response = curl -X POST `
            -F "file=@${{ env.ZIP_NAME }}" `
            -F "version=$version" `
            -F "changelog=$changelog" `
            -F "mandatory=$force" `
            "${env:OTA_SERVER}/api/upload"
            
          echo "响应: $response"
          
          # 检查响应
          if ($response.Contains('"success":true')) {
            Write-Host "✅ OTA 更新部署成功"
          } else {
            Write-Host "⚠️ OTA 更新部署可能失败，请检查服务器"
          }
        shell: pwsh
